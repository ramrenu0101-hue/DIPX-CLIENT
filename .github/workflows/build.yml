name: Build DIPX Client

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'DIPXClient.java'
      - 'DIPXScreen.java'
      - 'ModuleRegistry.java'
      - 'ModuleCategory.java'
      - '.github/workflows/build.yml'
      - 'DIPX-Client-source-ready.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Extract and overlay maintained sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dipx
          unzip -q DIPX-Client-source-ready.zip -d /tmp/dipx
          PROJECT="$(find /tmp/dipx -name build.gradle -printf '%h\n' | head -1)"
          test -n "$PROJECT"
          SOURCE_FILE="$(find "$PROJECT" -path '*/com/dipx/client/DIPXClient.java' -print -quit)"
          if [ -n "$SOURCE_FILE" ]; then
            SOURCE_ROOT="$(dirname "$SOURCE_FILE")"
          else
            SOURCE_ROOT="$PROJECT/src/main/java/com/dipx/client"
          fi
          mkdir -p "$SOURCE_ROOT/gui"
          cp DIPXClient.java "$SOURCE_ROOT/DIPXClient.java"
          cp DIPXScreen.java "$SOURCE_ROOT/gui/DIPXScreen.java"
          mkdir -p "$SOURCE_ROOT/module"
          cp ModuleRegistry.java "$SOURCE_ROOT/module/ModuleRegistry.java"
          cp ModuleCategory.java "$SOURCE_ROOT/module/ModuleCategory.java"
          echo "Project: $PROJECT"
          echo "Source root: $SOURCE_ROOT"
          find "$PROJECT" -path '*/com/dipx/client/*.java' -o -path '*/com/dipx/client/gui/*.java'
          gradle -p "$PROJECT" build --no-daemon
          mkdir -p dist
          find "$PROJECT/build/libs" -maxdepth 1 -name '*.jar' -type f -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.jar' -print -quit)"
          # Preserve the actual compiled source tree for diagnosis of runtime
          # module registration and GUI behavior; this is not a release artifact.
          mkdir -p diagnostics
          cp -R "$SOURCE_ROOT" diagnostics/client-source
          cp -R "$PROJECT/src/main/resources" diagnostics/resources 2>/dev/null || true
          zip -qr dist/DIPX-source-diagnostic.zip diagnostics
      - name: Verify remapped client JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find dist -maxdepth 1 -name '*.jar' ! -name '*sources.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q fabric.mod.json
          jar tf "$JAR" | grep -q com/dipx/client/DIPXClient.class
          jar tf "$JAR" | grep -q com/dipx/client/gui/DIPXScreen.class
          jar tf "$JAR" | grep -q com/dipx/client/module/ModuleRegistry.class
          unzip -p "$JAR" fabric.mod.json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['id']=='dipx'; assert d['depends']['minecraft']=='=1.21.11'; assert 'com.dipx.client.DIPXClient' in d['entrypoints']['client']; print('Verified DIPX Fabric metadata and required classes')"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DIPX-Client-JAR
          path: dist/*.jar
      - name: Upload source diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: DIPX-Source-Diagnostic
          path: dist/DIPX-source-diagnostic.zip
