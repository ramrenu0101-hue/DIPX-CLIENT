
name: Build DIPX Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Extract source
        run: |
          mkdir -p /tmp/dipx
          unzip -q DIPX-Client-source-ready.zip -d /tmp/dipx
          PROJECT=$(find /tmp/dipx -name build.gradle -printf '%h\n' | head -1)
          test -n "$PROJECT"
          gradle -p "$PROJECT" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DIPX-Client-JAR
          path: /tmp/dipx/**/build/libs/*.jar
